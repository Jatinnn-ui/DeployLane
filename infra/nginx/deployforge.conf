##############################################################################
# Reverse proxy for the DeployForge control plane.
#
# Fronts the dashboard and the API on one origin, which removes CORS entirely and lets the refresh
# cookie be Secure and same-site in production.
#
# This proxies DeployForge itself. It does not route to deployed applications - on a single node those
# are reached through published host ports (see infra/traefik/README.md for the routing alternative).
#
# Terminate TLS in front of this (certbot, a load balancer, or Cloudflare) and set COOKIE_SECURE=true.
##############################################################################

upstream deployforge_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream deployforge_frontend {
    server 127.0.0.1:5173;
    keepalive 16;
}

server {
    listen 80;
    server_name deployforge.example.com;

    # Build output streams through this proxy, so buffering it would defeat live logs.
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 2m;

    # WebSocket for live deployment output. The long read timeout matters: a build can run for minutes
    # between messages and nginx would otherwise drop the connection mid-deployment.
    location /ws/ {
        proxy_pass http://deployforge_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://deployforge_backend;
        # Image builds are slow; the platform enforces its own timeout, the proxy should not pre-empt it.
        proxy_read_timeout 300s;
    }

    # Actuator is for operators, not the internet. Restrict it or drop this block entirely.
    location /actuator/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://deployforge_backend;
    }

    location / {
        proxy_pass http://deployforge_frontend;
    }
}
