<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="DeployLane — modern deployment and project management platform for developers."
    />
    <title>DeployLane — A clear path to production</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700;750&display=swap" rel="stylesheet" />
    <link rel="icon" href="/brand/deploylane-icon.svg" type="image/svg+xml" />
    <script>
      // Commit the stored theme before first paint. Without this the page renders
      // in the default theme and then snaps to the stored one once React mounts.
      // Key and default must match src/stores/theme-store.ts.
      (function () {
        try {
          var stored = localStorage.getItem('deploylane.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'light';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', theme);
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>DeployLane requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
