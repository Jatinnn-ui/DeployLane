<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none">
  <!-- Icon mark: rounded dark square with D-arrow motif -->
  <rect x="2" y="6" width="88" height="88" rx="20" fill="#2a2a27"/>
  <!-- Lime arrow stroke (upper lane) -->
  <path d="M24 62 C32 54, 42 44, 54 34 L54 48 C62 40, 68 34, 76 28" stroke="#c5d800" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- White arrow stroke (lower lane) -->
  <path d="M22 72 C34 60, 46 48, 62 36" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.92"/>
  <!-- Wordmark -->
  <text x="104" y="67" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#f5f5f4">Deploy</tspan><tspan fill="#c5d800">Lane</tspan>
  </text>
</svg>
