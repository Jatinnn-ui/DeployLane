<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none" role="img" aria-label="DeployLane">
  <!-- Icon tile stays dark in both themes: it is the brand mark, not a themed surface. -->
  <rect x="2" y="6" width="88" height="88" rx="20" fill="#212221"/>
  <path d="M24 62 C32 54, 42 44, 54 34 L54 48 C62 40, 68 34, 76 28"
        stroke="#A8F000" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 72 C34 60, 46 48, 62 36"
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.92"/>
  <!-- Wordmark inverted for light backgrounds: dark ink "Deploy", lime "Lane". -->
  <text x="104" y="67"
        font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#212221">Deploy</tspan><tspan fill="#6C9700">Lane</tspan>
  </text>
</svg>
